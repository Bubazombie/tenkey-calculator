version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nolintlint
    - revive
    - unconvert
    - usestdlibvars
  exclusions:
    rules:
      # Tests use seeded math/rand on purpose: failures must be reproducible.
      - path: _test\.go
        linters: [gosec]
        text: G404

formatters:
  enable:
    - gofmt
    - goimports
